<!DOCTYPE html>
<html lang='zh-CN'>
<head>
<meta charset='UTF-8'>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:340px;font-family:system-ui,sans-serif;font-size:13px}
.head{background:linear-gradient(135deg,#1e40af,#2563eb);color:#fff;padding:12px 14px}
.head h1{font-size:15px;margin-bottom:2px}.head p{font-size:11px;opacity:.85}
.body{padding:14px}.f{margin-bottom:10px}
.f label{display:block;font-size:12px;color:#475569;margin-bottom:4px}
.f input,.f select{width:100%;padding:7px 9px;border:1px solid #e2e8f0;border-radius:6px;font-size:12px;font-family:inherit;background:#fff}
.f input:focus,.f select:focus{outline:none;border-color:#2563eb}
.f .hint{font-size:10px;color:#94a3b8;margin-top:3px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions{display:flex;gap:6px;margin-top:12px}
.btn{flex:1;padding:7px 12px;border-radius:6px;border:1px solid #e2e8f0;background:#fff;cursor:pointer;font-size:12px;font-weight:500}
.btn.primary{background:#2563eb;color:#fff;border-color:#2563eb}
.btn.primary:hover{background:#1d4ed8}
.status{margin-top:10px;font-size:11px;color:#64748b;min-height:16px}
.status.ok{color:#059669}.status.err{color:#dc2626}
</style>
</head>
<body>
<div class='head'><h1>OJ 助手 · 配置</h1><p>选平台 → 填 Key → 保存，去程天学/力扣自动出现按钮</p></div>
<div class='body'>
<div class='f'><label>快速选择平台</label>
<select id='preset'>
<option value=''>—— 从常用平台选（选了自动填 baseUrl 和模型）——</option>
<option value='deepseek'>DeepSeek（便宜稳定，新用户送 500 万 tokens）</option>
<option value='siliconflow'>硅基流动（50+ 开源模型，部分免费）</option>
<option value='moonshot'>月之暗面 Kimi</option>
<option value='qwen'>阿里云百炼 通义千问</option>
<option value='volc'>字节火山引擎 豆包</option>
<option value='tencent'>腾讯云 混元</option>
<option value='zhipu'>智谱 AI 清言</option>
<option value='openrouter'>OpenRouter（聚合多平台）</option>
<option value='local'>本地 Ollama（http://127.0.0.1:11434）</option>
<option value='custom'>完全自定义（手动填）</option>
</select></div>
<div class='f'><label>API Key</label><input type='password' id='apiKey' placeholder='sk-xxxxxx...'><div class='hint'>DeepSeek 新用户送 500 万 tokens；硅基流动有免费额度</div></div>
<div class='f'><label>接口地址（baseUrl）</label><input type='text' id='baseUrl' placeholder='https://api.deepseek.com'><div class='hint'>以 /v1 结尾自动拼 /chat/completions；不带也能处理</div></div>
<div class='row'><div class='f'><label>模型</label><input type='text' id='model' placeholder='deepseek-chat'></div>
<div class='f'><label>默认语言</label>
<select id='language'><option>C++17</option><option>C++20</option><option>Python3</option><option>Java</option><option>Go</option><option>Rust</option><option>C</option></select></div></div>
<div class='actions'><button class='btn primary' id='save'>保存配置</button><button class='btn' id='test'>测试连通性</button></div>
<div class='status' id='status'></div>
</div>
<script src='popup.js'></script>
</body></html>
